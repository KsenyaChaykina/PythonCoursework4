{% extends 'sending_messages/base.html' %}
{% block content %}


<h2>Удалить рассылку?</h2>
<p>Вы действительно хотите удалить рассылку #{{ object.pk }} с темой "{{ object.message.subject }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="button" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'sending_messages:newsletter_list' %}" style="margin-left: 10px;">Отмена</a>
</form>

{% endblock %}
