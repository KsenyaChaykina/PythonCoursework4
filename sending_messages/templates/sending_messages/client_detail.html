{% extends 'sending_messages/base.html' %}
{% block content %}
<div class="col-12">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <h4 class="my-0 font-weight-normal">Профиль получателя</h4>
        </div>
        <div class="card-body">
            <form method="post" action="" class="form-floating">
                <div class="table-responsive small">
                    <p><strong>Ф. И. О.:</strong> {{ client.full_name }}</p>
                    <p><strong>Email:</strong> {{ client.email }}</p>
                    <p><strong>Комментарий:</strong></p>
                    <p>{{ client.comment|default:"—"|linebreaks }}</p>

                </div>
                <hr>
                <a href="{% url 'sending_messages:client_update' client.pk %}">Редактировать профиль</a> |
                <a href="{% url 'sending_messages:client_list' %}">Назад к списку клиентов</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
