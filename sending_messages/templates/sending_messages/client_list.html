{% extends 'sending_messages/base.html' %}
{% block content %}
<div class="col-12">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <h4 class="my-0 font-weight-normal">Список получателей рассылки</h4>
        </div>
        <div class="card-body">
            <form method="post" action="" class="form-floating">
                <div class="table-responsive small">
                    <table class="table table-striped table-sm">
                        <thead>
                        <tr>
                            <th scope="col">Ф. И. О.</th>
                            <th scope="col">Email</th>
                            <th scope="col">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            {% for client in clients %}
                            <td><a href="{% url 'sending_messages:client_detail' client.pk %}">{{ client.full_name }}</a></td>
                            <td>{{ client.email }}</td>
                            <td><a href="{% url 'sending_messages:client_update' client.pk %}" class="btn btn-sm btn-outline-primary py-1">Редактировать</a>
                                <a href="{% url 'sending_messages:client_delete' client.pk %}" class="btn btn-sm btn-outline-danger py-1">Удалить</a></td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3">Получатели еще не добавлены.</td>
                        </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
