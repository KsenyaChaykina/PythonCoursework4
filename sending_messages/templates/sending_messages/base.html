{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление рассылками</title>
    <script src="{% static 'js/color-modes.js' %}"></script>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
<header data-bs-theme="dark">
    {% include 'sending_messages/includes/inc_menu.html' %}
</header>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Рассылка сообщений для клиентов</h1>
</div>

<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <nav class="ms-5">
                            <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:client_list' %}">Получатели
                                рассылок</a>
                            <a class="p-2 btn btn-outline-primary" href="/contacts/">Рассылки</a>
                            <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:message_list' %}">Сообщения</a>
                        </nav>
                    </table>
                </div>
            </div>
            {% block content %}
            {% endblock %}
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Добавить нового получателя</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating">
                        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:client_create' %}">Добавить</a>
                    </form>
                </div>
            </div>
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Создать новое сообщение</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating">
                        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:message_create' %}">Создать</a>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <div class="row">
            <div class="col-12 col-md"></div>
        </div>
    </footer>
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}">

</script>
</body>
</html>
