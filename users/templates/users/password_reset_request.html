{% extends 'sending_messages/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<h2>Восстановление пароля</h2>
<p>Введите email, указанный при регистрации:</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Отправить ссылку</button>
</form>
{% endblock %}
